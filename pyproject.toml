[project]
name = "laminate"
version = "0.1.0"
description = "Generate release-ready changelogs from git log using a local LLM"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python",
    "pydantic",
    "typer",
]

[project.scripts]
laminate = "laminate.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"