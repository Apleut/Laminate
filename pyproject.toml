[project]
name = "laminate-cli"
version = "0.1.1"
description = "Generate release-ready changelogs from git history using a local LLM"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "llama-cpp-python",
    "pydantic",
    "typer",
    "rich",
]

[project.scripts]
laminate = "laminate.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laminate*"]
